<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/app.js" type="module" defer></script>
    <title>Admin Panel - ProVision</title>
</head>
<body>
    <main class="nav-container">
        <nav class="nav-hero container">
            <h2 class="logo"><a href="index.html">ProVision</a></h2>
            <div class="li-container">
                <ul class="links">
                    <li class="nav-items"><a href="./index.html">Home</a></li>
                    <li class="nav-items"><a href="./store.html">Store</a></li>
                    <li class="nav-items"><a href="./about.html">About</a></li>
                </ul>
            </div>
        </nav>
    </main>
    <section class=" admin-main-container">
        <h1 class="admin-head">Admin Control Panel</h1>
        <section class="form-container">
            <form id="add-product-form">
                    <div class="field">
                    <label for="p-name">Product Name</label>
                    <input type="text" id="p-name" placeholder="e.g. ProVision Titan 18" required>
                </div>
                <div class="field">
                    <label for="p-category">Category</label>
                    <select id="p-category" required>
                        <option value="" disabled selected>Select Category</option>
                        <option value="Laptops">Laptops</option>
                        <option value="Peripherals">Peripherals</option>
                        <option value="Accessories">Accessories</option>
                    </select>
                </div>
                <div class="field">
                    <label for="p-price">Price ($)</label>
                    <input type="number" id="p-price" placeholder="e.g. 1999" min="1" required>
                </div>
                <div class="field">
                    <label for="p-image">Image URL</label>
                    <input type="url" id="p-image" placeholder="https://unsplash.com/..." required>
                </div>
                <div class="field">
                    <label for="p-specs">Specifications</label>
                    <input type="text" id="p-specs" placeholder="e.g. RTX 4080 | 64GB RAM | 2TB SSD" required>
                </div>
                <div class="submit-action">
                    <button type="submit" id="add-btn" class="btn-primary">Add Product</button>
                </div>
            </form>
        </section>
    </section>
    <script type="module" src="./js/add.js"></script>
</body>
</html>
